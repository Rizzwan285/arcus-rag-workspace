version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: arcus-postgres
    restart: always
    environment:
      POSTGRES_USER: arcus
      POSTGRES_PASSWORD: arcus_password
      POSTGRES_DB: arcus_db
    ports:
      - "5432:5432"
    volumes:
      - arcus-db-data:/var/lib/postgresql/data

volumes:
  arcus-db-data:
